<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — BackupS3</title><link rel="stylesheet" href="/app.css"></head><body class="login-page"><form id="login" class="login-card"><span class="logo large">BS<span>3</span></span><h1>BackupS3 Server</h1><p>Вход в центральную консоль</p><label>Пароль администратора<input id="password" type="password" required autofocus autocomplete="current-password"></label><div id="error" class="error"></div><button type="submit">Войти</button></form><script>login.onsubmit=async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(r.ok)location.href='/';else error.textContent='Неверный пароль администратора.'}</script></body></html>
